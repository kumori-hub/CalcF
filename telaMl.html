<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CalcF - Xarope</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container-fluid">
            <a href="index.html" class="btn btn-outline-light btn-sm">Voltar</a>
            <span class="navbar-brand mb-0 h1">CalcF</span>
            <div style="width: 60px;"></div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-success text-white border-0 rounded-top-4 py-4">
                        <h5 class="card-title mb-0 text-center">Xarope</h5>
                    </div>
                    <img src="imgMls.png" class="card-img-middle p-4" alt="Xarope"
                        style="object-fit: contain; height: 200px;">
                    <div class="card-body">
                        <p class="text-muted mb-4 text-center">Insira os valores para calcular a posologia:</p>

                        <div class="mb-3">
                            <label for="num1" class="form-label">Quantidade de MLs por dose</label>
                            <input type="number" class="form-control form-control-lg" id="num1" placeholder="Ex: 10"
                                min="0">
                        </div>

                        <div class="mb-3">
                            <label for="num2" class="form-label">Quantidade de doses por dia</label>
                            <input type="number" class="form-control form-control-lg" id="num2" placeholder="Ex: 3"
                                min="0">
                        </div>

                        <div class="mb-4">
                            <label for="num3" class="form-label">Quantidade de MLs por frasco</label>
                            <input type="number" class="form-control form-control-lg" id="num3" placeholder="Ex: 120"
                                min="0">
                        </div>

                        <button onclick="realizarCalculoMl()"
                            class="btn btn-success btn-lg w-100 rounded-3 mb-3">Calcular Resultado</button>

                        <div id="resultado"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
